<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="San Admin System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="San Admin System">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>San Admin System</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fonts Preload & Fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/assets/fonts/ReadexPro-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/ReadexPro-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/ReadexPro-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/ReadexPro-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'ReadexPro';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/assets/fonts/ReadexPro-Regular.ttf') format('truetype'),
           url('assets/fonts/ReadexPro-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'ReadexPro';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('assets/assets/fonts/ReadexPro-Medium.ttf') format('truetype'),
           url('assets/fonts/ReadexPro-Medium.ttf') format('truetype');
    }
    @font-face {
      font-family: 'ReadexPro';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('assets/assets/fonts/ReadexPro-SemiBold.ttf') format('truetype'),
           url('assets/fonts/ReadexPro-SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'ReadexPro';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('assets/assets/fonts/ReadexPro-Bold.ttf') format('truetype'),
           url('assets/fonts/ReadexPro-Bold.ttf') format('truetype');
    }
    body {
      font-family: 'ReadexPro', 'Readex Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function (error) {
          console.warn('Firebase Messaging Service Worker registration failed: ', error);
        });
      });
    }

    window.showBrowserNotification = function(title, body) {
      if (!('Notification' in window)) return;
      function display() {
        if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function(reg) {
            reg.showNotification(title, {
              body: body,
              icon: '/favicon.png',
              badge: '/favicon.png',
              tag: Date.now().toString()
            });
          }).catch(function() {
            try { new Notification(title, { body: body, icon: '/favicon.png' }); } catch(e){}
          });
        } else {
          try { new Notification(title, { body: body, icon: '/favicon.png' }); } catch(e){}
        }
      }
      if (Notification.permission === 'granted') {
        display();
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') display();
        });
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
